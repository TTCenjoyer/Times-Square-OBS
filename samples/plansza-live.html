<!doctype html><html lang="pl"><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1533;color:#fff;font-family:Arial,sans-serif}.grid{position:absolute;inset:0;background:linear-gradient(90deg,#ffffff0d 2px,transparent 2px),linear-gradient(#ffffff0d 2px,transparent 2px),linear-gradient(130deg,#1644a7,#3c176c 60%,#103e64);background-size:120px 120px,120px 120px,100% 100%}.bar{position:absolute;inset:0;background:linear-gradient(90deg,transparent 43%,#39fbc060 50%,transparent 57%);animation:sweep 7s linear infinite;transform:translateX(-100%)}@keyframes sweep{to{transform:translateX(100%)}}.content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:40px}.pill{font-size:44px;letter-spacing:10px;color:#6fffd0}.dot{display:inline-block;width:26px;height:26px;background:#6fffd0;border-radius:50%;margin-right:22px;animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.3}}h1{font-size:135px;letter-spacing:-6px;margin:0}#clock{font-size:130px;letter-spacing:8px;font-weight:bold;font-variant-numeric:tabular-nums}.note{font-size:42px;opacity:.8}.cross{position:absolute;top:50%;left:0;right:0;height:2px;background:#ffffff20}.footer{position:absolute;bottom:60px;font-size:30px;letter-spacing:8px;color:#a6b6e8}
</style><div class="grid"></div><div class="bar"></div><div class="cross"></div><div class="content"><div class="pill"><span class="dot"></span>TIMES SQUARE LIVE</div><h1>TWÓJ OBRAZ NA ŻYWO</h1><div id="clock"></div><div class="note">Dodaj swoje źródło w scenie „01 | Obraz na billboardach”</div><div class="footer">PODGLĄD DZIAŁANIA • OBS STUDIO</div></div><script>function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('pl-PL',{hour12:false,timeZone:'Europe/Warsaw'});}tick();setInterval(tick,200);</script></html>
